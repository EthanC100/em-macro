    approach: directional
    mechanism_class: informational
    sign: "+"
    rationale: >-
      Hyperscale cloud operators and AI model providers buy accelerators, memory, networking, storage and
      servers. Their capex plans and adoption signals propagate to infrastructure suppliers over quarters.
      Investors may price the most visible suppliers quickly but second-tier component and networking
      suppliers slowly.
    counterparty: >-
      Investors who concentrate on the most visible beneficiaries and underweight less-followed second-tier
      suppliers exposed to the same demand.
    target_universe: >-
      US-listed accelerator, memory, networking, storage, server and interconnect suppliers
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, cloud_capex, relationship_graph, developer_adoption, product_releases, customer_concentration]
    availability_risks:
      - Supplier exposure to cloud and AI demand is mapped with hindsight unless taken from dated disclosures.
      - Developer-adoption and product-release data have short histories and unknown timestamping.
      - The AI demand episode is short and unique, so very few independent observations exist.
    signal_concept: >-
      Exposure-weighted change in cloud capex guidance or AI adoption measures mapped to suppliers through
      dated links, relative to supplier consensus.
    holding_horizon: "60-250 trading days"
    horizon_bucket: quarters
    baselines:
      - industry momentum (TE-E02)
      - supplier revisions (TE-A03)
      - size
    confounders:
      - single-theme momentum and crowding
      - discount-rate shocks (TE-F01)
    transaction_costs: low
    cost_notes: >-
      Low turnover; long-only ranking but concentrated in a crowded theme.
    validation_requirements:
      - Links dated as first disclosed; exposure weights from PIT segment or customer disclosures.
      - Results by sub-period; not dominated by a single demand episode.
      - Adoption data used only from the date the vendor began capturing it live.
    failure_conditions:
      - Effect exists only in one recent episode.
      - Second-tier suppliers react as fast as first-tier.
    kill_condition: >-
      Mapped compute demand changes do not predict supplier returns beyond momentum and revisions outside a
      single episode.
    tail_exposure: >-
      Thematic crowding unwinds can cause large simultaneous drawdowns across all suppliers.
    implementation_complexity: high
    grouped_variants: >-
      Cloud capex versus AI adoption signals, accelerator versus memory versus networking sub-groups, link
      weighting, lag structure.
    ranking:
