  # ---------------------------------------------------------------------------------------------------
  # E. Factor
  # ---------------------------------------------------------------------------------------------------

  - id: TE-E01
    name: Price momentum within technology
    research_family: E_factor
    approach: directional
    mechanism_class: behavioural
    sign: "+"
    rationale: >-
      Stocks with high returns over the past year, skipping the most recent month, tend to continue
      outperforming over the following months, usually attributed to underreaction and later overreaction.
      This family is the reference point every other technology signal must beat, not a novel idea.
    counterparty: >-
      Investors who underreact to news and contrarian rebalancers who sell winners early.
    target_universe: >-
      US-listed technology companies passing PIT liquidity filters
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, classification_history]
    availability_risks:
      - Survivorship without delisting returns inflates momentum profits, especially among failed small-cap technology firms.
      - Corporate actions must be applied as known at the time.
    signal_concept: >-
      Cumulative total return over an intermediate look-back, skipping the most recent month, ranked within the
      technology universe.
    holding_horizon: "20-120 trading days"
    horizon_bucket: months
    baselines:
      - market beta
      - equal-weighted technology universe
    confounders:
      - industry momentum (TE-E02)
      - growth-versus-value cycles
    transaction_costs: medium
    cost_notes: >-
      Monthly turnover typical of momentum; long-only ranking avoids borrow.
    validation_requirements:
      - Delisting returns included.
      - Results by sub-period, including known momentum-crash regimes, without tuning to them.
    failure_conditions:
      - No outperformance within technology after costs.
    kill_condition: >-
      Technology-universe momentum ranking does not beat the equal-weighted universe after costs.
    tail_exposure: >-
      Momentum crashes after sharp market rebounds and growth-to-value rotations.
    implementation_complexity: low
    grouped_variants: >-
      Look-back and skip lengths, volatility scaling, weighting scheme.
    ranking:
      economic_plausibility: 3
      data_feasibility: 4
      research_cost: 5
      implementation_simplicity: 5
      distinctiveness: 1
      leakage_safety: 4

  - id: TE-E02
    name: Technology sub-industry momentum
    research_family: E_factor
    approach: directional
    mechanism_class: behavioural
    sign: "+"
    rationale: >-
      Industry-wide news diffuses slowly across firms in a sub-industry, so sub-industries that have performed
      well continue to do so. This is a between-industry effect, distinct from firm-specific momentum.
    counterparty: >-
      Investors who analyse firms individually and miss the common sub-industry component of news.
    target_universe: >-
      US-listed technology companies grouped by PIT sub-industry
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, classification_history]
    availability_risks:
      - Sub-industry classification must be point in time; today's classification embeds later reclassifications.
      - Few sub-industries means few independent bets.
    signal_concept: >-
      Past return of each sub-industry over an intermediate look-back, used to tilt holdings across
      sub-industries.
    holding_horizon: "20-120 trading days"
    horizon_bucket: months
    baselines:
      - price momentum (TE-E01)
      - market beta
    confounders:
      - firm-level momentum
      - macro exposures (TE-F01, TE-F04)
    transaction_costs: low
    cost_notes: >-
      Low turnover at sub-industry level; liquid names.
    validation_requirements:
      - PIT classification.
      - Inference that accounts for the small number of sub-industries.
    failure_conditions:
      - Redundant with firm-level momentum.
      - Too few sub-industries for reliable inference.
    kill_condition: >-
      Sub-industry momentum adds nothing to firm-level momentum within technology.
    tail_exposure: >-
      Concentrated sub-industry bets suffer in sharp sector rotations.
    implementation_complexity: low
    grouped_variants: >-
      Look-back lengths, classification depth, weighting.
    ranking:
      economic_plausibility: 3
      data_feasibility: 4
      research_cost: 4
      implementation_simplicity: 4
      distinctiveness: 1
      leakage_safety: 4

  - id: TE-E03
    name: Short-term reversal
    research_family: E_factor
    approach: relative_value
    mechanism_class: flow
    sign: "-"
    rationale: >-
      Stocks with extreme returns over the past week or month tend to partly reverse because those returns
      include temporary price pressure from liquidity demand. Liquidity providers are paid for absorbing it.
    counterparty: >-
      Investors demanding immediacy who pay a temporary price concession.
    target_universe: >-
      US-listed technology companies passing PIT liquidity filters
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, earnings_events]
    availability_risks:
      - Stale closing prices and bid-ask bounce create spurious reversal.
      - Survivorship and delisting returns matter for extreme losers.
    signal_concept: >-
      Past-week or past-month return, ranked, excluding announcement-driven moves.
    holding_horizon: "5-20 trading days"
    horizon_bucket: days
    baselines:
      - market beta
      - industry exposure
    confounders:
      - bid-ask bounce
      - peer-spread reversion (TE-A01)
    transaction_costs: high
    cost_notes: >-
      Very high turnover; costs may consume most of the predicted return.
    validation_requirements:
      - Skip one day between signal and entry.
      - Costs from realistic spread models by size.
    failure_conditions:
      - Profits do not survive a one-day skip and costs.
    kill_condition: >-
      Reversal returns do not survive a one-day implementation lag and realistic costs.
    tail_exposure: >-
      Losses in trending markets and in liquidity crises.
    implementation_complexity: medium
    grouped_variants: >-
      Weekly versus monthly reversal, industry-adjusted versus raw, exclusion of event days.
    ranking:
      economic_plausibility: 4
      data_feasibility: 4
      research_cost: 4
      implementation_simplicity: 4
      distinctiveness: 1
      leakage_safety: 4

  - id: TE-E04
    name: Profitability and earnings quality
    research_family: E_factor
    approach: directional
    mechanism_class: behavioural
    sign: "+"
    rationale: >-
      More profitable firms with cash-backed earnings tend to earn higher subsequent returns than less
      profitable firms, which investors may undervalue relative to growth stories. In technology, profitability
      measures must deal with stock-based compensation and capitalised development costs.
    counterparty: >-
      Investors who favour growth narratives over current profitability.
    target_universe: >-
      US-listed technology companies with PIT fundamentals
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, fundamentals_pit]
    availability_risks:
      - Restatements overwrite originally reported fundamentals.
      - Filing-date lags must be respected.
    signal_concept: >-
      Gross profit or cash-based operating profit scaled by assets, adjusted for stock-based compensation, with
      an accruals component.
    holding_horizon: "60-250 trading days"
    horizon_bucket: quarters
    baselines:
      - market beta
      - value factor
    confounders:
      - value
      - size
      - stock-based compensation accounting
    transaction_costs: low
    cost_notes: >-
      Low turnover; liquid names.
    validation_requirements:
      - As-first-reported fundamentals with filing-date lag.
      - Compare with and without stock-based compensation adjustments, pre-specified.
    failure_conditions:
      - No outperformance within technology.
    kill_condition: >-
      Profitability ranking does not beat the technology universe after costs.
    tail_exposure: >-
      Underperforms in speculative growth rallies.
    implementation_complexity: low
    grouped_variants: >-
      Gross versus operating profitability, accruals, stock-based compensation treatment, scaling.
    ranking:
      economic_plausibility: 4
      data_feasibility: 3
      research_cost: 4
      implementation_simplicity: 4
      distinctiveness: 1
      leakage_safety: 3

  - id: TE-E05
    name: Investment, issuance and stock-compensation dilution
    research_family: E_factor
    approach: relative_value
    mechanism_class: behavioural
    sign: "-"
    rationale: >-
      Firms that grow assets quickly or issue equity (including through stock-based compensation) tend to
      underperform, consistent with managers timing issuance when shares are overvalued and investors
      underweighting dilution. Technology firms dilute heavily through compensation, which may be
      underweighted relative to headline issuance.
    counterparty: >-
      Investors who buy newly issued shares and ignore ongoing dilution.
    target_universe: >-
      US-listed technology companies with PIT fundamentals and share counts
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, fundamentals_pit]
    availability_risks:
      - Share counts must be as of filing dates; vendor histories may use later figures.
      - Restated asset values change historical growth.
    signal_concept: >-
      Asset growth and net share issuance including dilution from compensation, relative to peers.
    holding_horizon: "60-250 trading days"
    horizon_bucket: quarters
    baselines:
      - investment factor
      - value factor
    confounders:
      - value
      - profitability
    transaction_costs: low
    cost_notes: >-
      Low turnover; short leg may include recently listed names with limited borrow.
    validation_requirements:
      - Share counts and assets as first reported.
      - Show whether the compensation component adds beyond standard issuance.
    failure_conditions:
      - Compensation dilution adds nothing to standard issuance and investment.
    kill_condition: >-
      Dilution-inclusive issuance does not predict hedged returns beyond the standard investment factor.
    tail_exposure: >-
      Short leg exposed to growth rallies in issuing firms.
    implementation_complexity: low
    grouped_variants: >-
      Asset growth, net issuance, compensation dilution, buyback adjustments.
    ranking:
      economic_plausibility: 4
      data_feasibility: 3
      research_cost: 4
      implementation_simplicity: 4
      distinctiveness: 2
      leakage_safety: 3

  - id: TE-E06
    name: Intangible-adjusted value
    research_family: E_factor
    approach: directional
    mechanism_class: risk_premium
    sign: "+"
    rationale: >-
      Book value understates the capital of technology firms because research and development and much of
      selling expense are expensed. Capitalising these expenditures gives a value measure that is more
      comparable across firms, so cheap firms on an intangible-adjusted basis may earn a value premium.
    counterparty: >-
      Investors who pay for growth without adjusting for the capital already embedded in the firm.
    target_universe: >-
      US-listed technology companies with PIT fundamentals
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, fundamentals_pit]
    availability_risks:
      - Capitalisation needs long expense histories; early-life firms have short histories.
      - Restatements affect the stock of intangibles.
    signal_concept: >-
      Book value plus capitalised research and selling expenses (with depreciation), relative to market value;
      variants adjust for expected growth.
    holding_horizon: "120-500 trading days"
    horizon_bucket: quarters
    baselines:
      - book-to-market
      - earnings yield
    confounders:
      - standard value factor
      - profitability
      - duration exposure (TE-F01)
    transaction_costs: low
    cost_notes: >-
      Very low turnover; liquid names.
    validation_requirements:
      - Capitalisation rates fixed in advance.
      - Show content beyond standard value factors.
    failure_conditions:
      - Redundant with standard value.
    kill_condition: >-
      Intangible-adjusted value adds nothing to standard value within technology.
    tail_exposure: >-
      Long periods of underperformance during growth rallies.
    implementation_complexity: medium
    grouped_variants: >-
      Capitalisation and depreciation rates, growth adjustments, value ratios.
    ranking:
      economic_plausibility: 3
      data_feasibility: 3
      research_cost: 3
      implementation_simplicity: 3
      distinctiveness: 2
      leakage_safety: 3

  - id: TE-E07
    name: Cash runway and balance-sheet strength
    research_family: E_factor
    approach: directional
    mechanism_class: behavioural
    sign: "+"
    rationale: >-
      Cash-burning technology firms with short runway face dilution or distress, and investors may underweight
      these costs. Longer runway and stronger balance sheets should predict higher returns relative to firms
      that will need to raise capital soon.
    counterparty: >-
      Investors drawn to growth or lottery-like payoffs who underweight dilution and distress costs.
    target_universe: >-
      US-listed technology companies with PIT fundamentals
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, fundamentals_pit]
    availability_risks:
      - Delisting returns essential; distressed firms often delist.
      - Cash burn measured from restated statements misleads.
    signal_concept: >-
      Months of cash runway given recent operating and investing cash flows, combined with leverage and
      liquidity ratios.
    holding_horizon: "60-250 trading days"
    horizon_bucket: quarters
    baselines:
      - distress risk factor
      - profitability (TE-E04)
    confounders:
      - profitability
      - size
    transaction_costs: medium
    cost_notes: >-
      Low turnover, but weak-balance-sheet names are often small and illiquid.
    validation_requirements:
      - Delisting returns included.
      - Content beyond profitability and size.
    failure_conditions:
      - Redundant with profitability and size.
    kill_condition: >-
      Runway does not predict returns beyond profitability, size and distress measures.
    tail_exposure: >-
      Speculative rallies in cash-burning firms.
    implementation_complexity: low
    grouped_variants: >-
      Runway definitions, leverage ratios, distress measures.
    ranking:
      economic_plausibility: 3
      data_feasibility: 3
      research_cost: 4
      implementation_simplicity: 4
      distinctiveness: 2
      leakage_safety: 3

  # ---------------------------------------------------------------------------------------------------
  # F. Macro
  # ---------------------------------------------------------------------------------------------------

  - id: TE-F01
    name: Discount-rate shocks and equity duration
    research_family: F_macro
    approach: relative_value
    mechanism_class: behavioural
    sign: "-"
    rationale: >-
      Long-duration technology equities, whose cash flows lie far in the future, are more sensitive to real
      yields and policy-rate expectations. If benchmark-constrained investors adjust slowly, real-yield and
      policy-path shocks may be reflected gradually in the relative prices of long- versus short-duration
      firms.
    counterparty: >-
      Benchmark-constrained and slow-moving investors who rebalance duration exposure gradually.
    target_universe: >-
      US-listed technology companies sorted by an equity-duration proxy
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, macro_pit, fundamentals_pit, analyst_estimates_pit]
    availability_risks:
      - Duration proxies built from forecast cash flows inherit consensus backfill.
      - Policy-expectation series must be taken as observed in markets at the time, not from revised data.
      - Few independent rate regimes; strong multiple-testing risk across macro conditioning variables.
    signal_concept: >-
      Recent change in real yields or market-implied policy path, interacted with each firm's duration proxy.
    holding_horizon: "5-60 trading days"
    horizon_bucket: weeks
    baselines:
      - same-day response to rate changes
      - value and growth factors
    confounders:
      - value factor
      - profitability
    transaction_costs: medium
    cost_notes: >-
      Moderate turnover; both legs mostly liquid.
    validation_requirements:
      - Macro data as observed at the time.
      - Distinguish predictive lag from contemporaneous response.
      - Inference that accounts for few independent rate regimes.
    failure_conditions:
      - Response is entirely contemporaneous.
      - Effect confined to one rate regime.
    kill_condition: >-
      Discount-rate shocks predict no subsequent relative return of long- versus short-duration technology
      stocks across regimes.
    tail_exposure: >-
      Abrupt policy reversals produce large losses in duration-tilted books.
    implementation_complexity: medium
    grouped_variants: >-
      Real-yield changes, policy-path surprises around scheduled announcements, duration proxies, look-back.
    ranking:
      economic_plausibility: 4
      data_feasibility: 4
      research_cost: 3
      implementation_simplicity: 3
      distinctiveness: 2
      leakage_safety: 2

  - id: TE-F02
    name: Credit conditions and financing-dependent technology
    research_family: F_macro
    approach: relative_value
    mechanism_class: risk_premium
    sign: "-"
    rationale: >-
      Unprofitable, cash-burning technology firms depend on equity and convertible issuance to fund
      operations. When credit spreads widen or lending standards tighten, their cost of external finance rises
      and the probability of dilutive or distressed raises increases. If investors price this funding channel
      slowly, financing-dependent firms should underperform self-funding peers after credit tightening.
    counterparty: >-
      Holders of speculative growth stocks who price product optionality but not refinancing risk, and who
      sell only once a dilutive raise is announced.
    target_universe: >-
      US-listed technology companies sorted by PIT external-financing dependence (cash burn relative to cash
      and market value)
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, macro_pit, fundamentals_pit]
    availability_risks:
      - Credit-spread series must be as observed at the time; lending-standards surveys must use first-release dates.
      - Financing dependence uses as-first-reported cash-flow statements lagged to filing date.
      - Few independent credit cycles, so macro conditioning invites overfitting.
      - Distressed firms delist often; delisting returns are essential.
    signal_concept: >-
      Recent change in credit conditions (high-yield or convertible spreads, lending standards) interacted
      with each firm's financing-dependence proxy, used to tilt from dependent towards self-funding firms.
    holding_horizon: "20-120 trading days"
    horizon_bucket: months
    baselines:
      - profitability (TE-E04)
      - cash runway (TE-E07), unconditional
      - market beta
    confounders:
      - discount-rate shocks (TE-F01), which move with credit
      - size and idiosyncratic volatility
      - unconditional distress effect
    transaction_costs: medium
    cost_notes: >-
      Moderate turnover driven by macro changes; the short leg sits in speculative names with costly or
      unavailable borrow.
    validation_requirements:
      - Macro inputs at first release or as observed in markets on the date.
      - Must show conditional content beyond the unconditional runway and profitability signals.
      - Control for contemporaneous real-yield changes.
      - Inference that treats each credit cycle as a small number of observations.
    failure_conditions:
      - Conditioning on credit adds nothing to unconditional cash runway.
      - Effect is a relabelled discount-rate response.
      - Effect confined to one tightening episode.
    kill_condition: >-
      Credit tightening does not predict relative underperformance of financing-dependent technology firms
      beyond discount-rate shocks and unconditional balance-sheet signals.
    tail_exposure: >-
      Liquidity-driven rallies in speculative names after policy easing can squeeze the short leg hard.
    implementation_complexity: medium
    grouped_variants: >-
      Credit measure (high-yield spreads, convertible spreads, lending standards), financing-dependence proxy,
      look-back of the credit change.
    ranking:
      economic_plausibility: 3
      data_feasibility: 4
      research_cost: 3
      implementation_simplicity: 3
      distinctiveness: 2
      leakage_safety: 2

  - id: TE-F03
    name: Energy costs and data-centre-intensive firms
    research_family: F_macro
    approach: relative_value
    mechanism_class: structural
    sign: "-"
    rationale: >-
      Electricity is a large operating cost for data-centre operators, hosting providers and semiconductor
      fabrication. Power contracts reprice with a lag, so an energy-price shock reaches reported margins one or
      more quarters later. If investors wait for reported margins, energy-intensive technology firms should
      underperform less energy-intensive peers after energy-price increases.
    counterparty: >-
      Investors who model technology firms on revenue growth and treat energy as a minor input, updating only
      when margin pressure is reported.
    target_universe: >-
      US-listed technology companies sorted by PIT energy intensity (data-centre operators, hosting, fabs
      versus asset-light software)
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, macro_pit, fundamentals_pit, segment_reporting, regulatory_filings_text]
    availability_risks:
      - Energy intensity is estimated from disclosures with lags and changing definitions; today's estimates embed later knowledge.
      - Regional power-price series may not have been available as of the date in the form used.
      - Contract structures (fixed versus floating power) are rarely disclosed, adding unobservable heterogeneity.
    signal_concept: >-
      Recent change in relevant wholesale power or fuel prices interacted with each firm's dated
      energy-intensity proxy.
    holding_horizon: "20-120 trading days"
    horizon_bucket: months
    baselines:
      - market beta and sub-industry exposure
      - data-centre build-out diffusion (TE-D05)
    confounders:
      - inflation and real-yield changes (TE-F01)
      - industrial cycle
      - demand growth for data-centre capacity that offsets costs
    transaction_costs: medium
    cost_notes: >-
      Moderate turnover in a narrow universe; some energy-intensive names are mid-cap with moderate borrow
      costs.
    validation_requirements:
      - Energy intensity from dated disclosures with a frozen proxy rule.
      - Control for rates, inflation and the industrial cycle.
      - Test whether subsequent margin surprises move in the predicted direction, not only returns.
    failure_conditions:
      - Energy intensity cannot be measured well enough to sort firms.
      - Returns respond only contemporaneously to energy prices.
      - Demand growth dominates cost effects throughout.
    kill_condition: >-
      Energy-price shocks do not predict relative returns or margin surprises of energy-intensive technology
      firms after rate, inflation and cycle controls.
    tail_exposure: >-
      Energy shocks coincide with broad market stress, so the relative position can be dominated by
      market-wide deleveraging.
    implementation_complexity: medium
    grouped_variants: >-
      Energy series (power, gas), regional weighting, intensity proxies, look-back of the price change.
    ranking:
      economic_plausibility: 2
      data_feasibility: 3
      research_cost: 3
      implementation_simplicity: 3
      distinctiveness: 3
      leakage_safety: 2

  - id: TE-F04
    name: Semiconductor and industrial cycle rotation
    research_family: F_macro
    approach: relative_value
    mechanism_class: informational
    sign: "+"
    rationale: >-
      Semiconductor demand is cyclical, driven by inventory swings at customers and tied to the broader
      industrial cycle, while software revenue is more recurring. Public leading indicators (manufacturing new
      orders, inventory-to-shipment ratios, semiconductor billings) turn before semiconductor earnings. If
      investors extrapolate recent sector earnings, improving indicators should predict semiconductors
      outperforming software.
    counterparty: >-
      Investors who extrapolate recent sector earnings trends and rotate only after reported results turn.
    target_universe: >-
      US-listed semiconductor and software companies, grouped by PIT classification
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, macro_pit, semiconductor_supply_chain, classification_history]
    availability_risks:
      - Industrial indicators are revised; first-release vintages and release dates are required.
      - Industry billings data are published with lags and occasionally restated.
      - Only a handful of independent semiconductor cycles exist in the available history.
    signal_concept: >-
      Direction and change of a pre-specified composite of first-release cycle indicators, used to tilt between
      semiconductors and software.
    holding_horizon: "60-250 trading days"
    horizon_bucket: quarters
    baselines:
      - sub-industry momentum (TE-E02)
      - semiconductor-versus-software price momentum
    confounders:
      - discount-rate shocks (TE-F01), since software is longer duration
      - inventory cycle analogues (TE-B03)
    transaction_costs: low
    cost_notes: >-
      Low turnover between two liquid groups; implementable with liquid baskets.
    validation_requirements:
      - First-release vintages aligned to release dates.
      - Composite fixed before evaluation; every attempted indicator logged.
      - Inference that respects the small number of cycles (block bootstrap over cycles).
    failure_conditions:
      - Indicators add nothing to relative price momentum.
      - Effect relies on revised rather than first-release data.
    kill_condition: >-
      First-release cycle indicators do not predict the semiconductor-versus-software spread beyond its own
      momentum.
    tail_exposure: >-
      Supply shocks and policy interventions (export controls, subsidies) can break the usual cycle relation
      abruptly.
    implementation_complexity: low
    grouped_variants: >-
      Indicator choice and composite weights, level versus change, look-back, tilt rule.
    ranking:
      economic_plausibility: 3
      data_feasibility: 3
      research_cost: 3
      implementation_simplicity: 3
      distinctiveness: 2
      leakage_safety: 2

  - id: TE-F05
    name: Currency moves and international revenue exposure
    research_family: F_macro
    approach: relative_value
    mechanism_class: informational
    sign: "-"
    rationale: >-
      Many technology firms earn a large share of revenue abroad. A stronger home currency reduces translated
      revenue and earnings, but analysts often update forecasts only when companies report or guide on the
      translation effect. If prices follow analysts, firms with high foreign revenue share should underperform
      domestically focused peers after currency appreciation.
    counterparty: >-
      Analysts and investors who wait for reported translation effects instead of applying observed currency
      moves to disclosed revenue mix.
    target_universe: >-
      US-listed technology companies with PIT geographic revenue disclosure
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, fx_rates, segment_reporting, analyst_estimates_pit, guidance_events]
    availability_risks:
      - Geographic segments are restated and defined inconsistently across firms and years.
      - Hedging programmes are disclosed unevenly, so true exposure is unobserved.
      - Consensus histories used to check the revision channel carry backfill risk.
    signal_concept: >-
      Recent change in a revenue-weighted trade-weighted currency index interacted with each firm's dated
      foreign revenue share.
    holding_horizon: "20-120 trading days"
    horizon_bucket: months
    baselines:
      - market beta and size
      - peer-relative revisions (TE-A03)
    confounders:
      - global growth shocks that move currencies and foreign demand together
      - hedging programmes
      - discount-rate shocks
    transaction_costs: medium
    cost_notes: >-
      Moderate turnover in mostly liquid large and mid caps; borrow rarely binding.
    validation_requirements:
      - Segment data as first reported and lagged to filing date.
      - Check the revision channel directly (subsequent consensus changes), not only returns.
      - Control for global growth proxies.
    failure_conditions:
      - Currency effects are fully priced at the time of the move.
      - Exposure measurement too noisy to sort firms.
    kill_condition: >-
      Currency moves interacted with foreign revenue share predict neither subsequent relative returns nor
      consensus revisions.
    tail_exposure: >-
      Abrupt currency reversals and global growth shocks can swamp the translation effect.
    implementation_complexity: medium
    grouped_variants: >-
      Currency basket weighting, exposure measure (revenue share, segment mix), look-back, revision-based
      versus return-based outcome.
    ranking:
      economic_plausibility: 3
      data_feasibility: 2
      research_cost: 3
      implementation_simplicity: 3
      distinctiveness: 3
      leakage_safety: 3

  - id: TE-F06
    name: Volatility regimes and crowding unwinds
    research_family: F_macro
    approach: directional
    mechanism_class: flow
    sign: "-"
    rationale: >-
      Technology stocks are frequently held in common by leveraged and risk-targeting investors. When market
      volatility rises, risk limits force these investors to cut exposure at the same time, so crowded names
      fall more than fundamentals justify. A crowding measure combined with rising implied volatility should
      predict underperformance of crowded names, which a long-only ranking can avoid.
    counterparty: >-
      Leveraged and volatility-targeting investors forced to deleverage, who sell regardless of price.
    target_universe: >-
      US-listed technology companies with PIT crowding proxies
    required_data: [security_master, prices_daily, corporate_actions, delisting_returns, market_calendar, options_implied_vol, short_interest, regulatory_filings_text]
    availability_risks:
      - Crowding measures from institutional holdings filings are published with long lags and must be dated to filing.
      - Single-name implied-volatility histories are vendor products with uneven coverage.
      - Crowding proxies are easy to tune after the fact around known unwind episodes.
    signal_concept: >-
      Crowding score (holdings concentration among leveraged investors, short interest on the other side,
      return co-movement) interacted with the level or change of market implied volatility, used to underweight
      crowded names.
    holding_horizon: "5-60 trading days"
    horizon_bucket: weeks
    baselines:
      - price momentum (TE-E01)
      - market beta
      - low-volatility tilt
    confounders:
      - momentum crashes
      - market beta in high-volatility periods
      - discount-rate shocks
    transaction_costs: medium
    cost_notes: >-
      Turnover rises exactly when spreads widen in volatile regimes, raising effective costs.
    validation_requirements:
      - Holdings data lagged to publication dates.
      - Crowding proxy frozen before evaluation; episodes not hand-picked.
      - Show content beyond momentum and beta in high-volatility periods.
    failure_conditions:
      - Redundant with momentum or beta.
      - Data lags make the signal arrive after the unwind.
    kill_condition: >-
      Crowding interacted with volatility does not predict underperformance beyond momentum and beta.
    tail_exposure: >-
      The signal may fail in the fastest unwinds if crowding data lag the event, leaving the portfolio fully
      exposed.
    implementation_complexity: high
    grouped_variants: >-
      Crowding measures (holdings, co-movement, short interest), volatility measures (level, change, term
      structure), regime definitions.
    ranking:
      economic_plausibility: 3
      data_feasibility: 2
      research_cost: 2
      implementation_simplicity: 2
      distinctiveness: 3
      leakage_safety: 2
