# D004: v1.0's pre-committed cut and stop rules (ledger/v1_rules.py, docs/ledger/v1_rules.md).
# Runs after every completed systematic-monthly run (the official month-end v1.0 run) and by hand. It reads the
# files that run committed to main (results/systematic/paper_pnl.csv and positions.csv, the screener file of the
# month) and writes only data/ledger/v1_rules.json and data/ledger/v1_rules_history.csv: drawdown from the live
# peak, live Sharpe after costs and the carry spread against the frozen 2005-2019 threshold, with a flag for every
# triggered rule (shown in the Ledger app and in the night shift's morning report).
# It NEVER changes exposure, never edits frozen v1.0 code, configs or tags, and leaves systematic-monthly unchanged.
#
# 2026-11-12 (Ethan): it acts only when the monthly run's `update` job actually ran and succeeded (the `ran` job asks
# the Actions API). Since Q002 a systematic-monthly run can end "success" with `update` skipped (the due gate found
# the month already rebalanced: the kick's or a backup's second attempt, or a safe-check dispatch), and the
# Monday/Thursday keep-cache runs end "success" with no update at all; none of them books a month-end. If the API
# cannot be read, it runs (re-evaluating is idempotent; a missed month-end is worse).
name: v1-rules-monitor

on:
  workflow_run:
    workflows: [systematic-monthly]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write             # dispatch ledger-pages after a commit (GITHUB_TOKEN pushes do not trigger it)

concurrency:
  group: v1-rules-monitor
  cancel-in-progress: false

jobs:
  # Did the triggering systematic-monthly run's `update` job run and succeed? Reads the run's jobs; writes nothing.
  ran:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Did the monthly update job run and succeed?
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual run: evaluating"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          update=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
                     --jq '[.jobs[] | select(.name == "update") | .conclusion][0] // "absent"') || update="unreadable"
          echo "systematic-monthly run $RUN_ID: update job ${update:-absent}"
          case "$update" in
            success)    echo "run=true" >> "$GITHUB_OUTPUT" ;;
            unreadable) echo "jobs API unreadable: evaluating anyway"; echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *)          echo "no month-end booked by this run: nothing to evaluate"; echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

  monitor:
    needs: ran
    # only when the monthly update ran and succeeded (or by hand); never after a gate skip or a keep-cache run
    if: needs.ran.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Evaluate the D004 rules (flags only)
        run: python -m ledger.v1_rules monitor

      - name: Commit and push the evaluation
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger/v1_rules.json data/ledger/v1_rules_history.csv
          if git diff --cached --quiet; then
            echo "nothing to commit"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          as_of=$(python -c "import json; print(json.load(open('data/ledger/v1_rules.json'))['as_of'])")
          git commit -q -m "v1.0 rules monitor (D004): ${as_of} month-end"
          for attempt in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "push rejected (attempt $attempt); re-evaluating on the new main" >&2
            sleep $((attempt * 4))
            git fetch -q origin main
            git reset -q --hard origin/main
            python -m ledger.v1_rules monitor
            git add data/ledger/v1_rules.json data/ledger/v1_rules_history.csv
            git diff --cached --quiet && { echo "nothing to commit"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; }
            git commit -q -m "v1.0 rules monitor (D004): ${as_of} month-end"
          done
          echo "could not push after 5 attempts" >&2
          exit 1

      - name: Rebuild the Ledger app
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ledger-pages.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "could not dispatch ledger-pages (it also runs daily)"
