# Monthly update of the systematic macro strategy (positions + paper P&L).
# Refreshes the input data and applies the FROZEN design (results/systematic/fit/frozen_design.json);
# no frozen result (event study, risk model, strategy test) is re-estimated or re-tested.
# Two versions run live in parallel on the same refreshed inputs (docs/v1.1_freeze.md):
#   v1.0 (frozen control)   -> results/systematic/       (steps and outputs as before v1.1 existed)
#   v1.1 (v1.0 + T18 rule)  -> results/systematic_v1.1/  and results/live_compare/turnover.csv
# The v1.1 steps run after v1.0's and are continue-on-error: a v1.1 failure never stops v1.0's rebalance
# from being committed, but it still opens (or comments on) the alert issue.
# If any step fails, the last step opens (or comments on) a GitHub issue
# "[ALERT] systematic-monthly failed <date>" with the failing step and the end of its log.
name: systematic-monthly

on:
  schedule:
    - cron: "23 7 3 * *"     # 07:23 UTC on the 3rd of every month, after month-end data are published
    - cron: "37 6 * * 1,4"   # Monday and Thursday: keep the raw-download cache alive (see keep-cache)
  workflow_dispatch:

permissions:
  contents: write
  issues: write              # failure alerts

concurrency:
  group: systematic-monthly
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'schedule' || github.event.schedule == '23 7 3 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash          # -eo pipefail: a step still fails when its output is piped through tee
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        id: install
        run: pip install -r requirements.txt 2>&1 | tee "$RUNNER_TEMP/install.log"

      # data/raw is gitignored (except the BondSpot / Borsa Istanbul scrapes and the IMF WEO files),
      # so every run starts with an empty download cache.  Restoring the previous run's copy lets a
      # source that is down (mindicador.cl answered 502, BCB sent an empty body, the IMF gateway
      # answered 401 during the Nov 2026 runs) fall back to last month's file with a warning instead
      # of failing.  EM_MACRO_REFRESH=1 makes every loader re-download first and use the cache only
      # as that fallback.  Files that git has are excluded from the cache: git has the right version.
      - name: Restore last run's raw downloads (fallback when a source is down)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            !data/raw/bondspot
            !data/raw/bist
            !data/raw/imf_weo
          key: raw-downloads-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: raw-downloads-

      - name: Refresh data (daily panel, 13-country panel, risk-model inputs)
        id: refresh
        env:
          EM_MACRO_REFRESH: "1"
        run: python -m em_macro.systematic refresh 2>&1 | tee "$RUNNER_TEMP/refresh.log"

      - name: Save raw downloads for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            !data/raw/bondspot
            !data/raw/bist
            !data/raw/imf_weo
          key: raw-downloads-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Positions and paper P&L (frozen design)
        id: update
        run: python -m em_macro.systematic update 2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: Rebalance log (scheduled date vs actual run date)
        id: rebalance
        run: python -m em_macro.rebalance 2>&1 | tee "$RUNNER_TEMP/rebalance.log"

      - name: Political-risk overlay (frozen rule) and manual overrides from overrides.yaml
        id: overlay
        run: python -m em_macro.overlay update 2>&1 | tee "$RUNNER_TEMP/overlay.log"

      # Ledger screener (ledger/screener.py): every country's signals, ranks, position and catalysts after the
      # rebalance, filed as a report and shown in the app. Read-only use of the frozen inputs and signal code;
      # a failure here never blocks the rebalance (continue-on-error).
      - name: Ledger screener
        id: screener
        continue-on-error: true
        run: python -m ledger.screener 2>&1 | tee "$RUNNER_TEMP/screener.log"

      # v1.1 = frozen v1.0 + the T18 rebalancing rule (em_macro/systematic_v11.py). Same inputs as v1.0's
      # update; writes only results/systematic_v1.1/ and results/live_compare/. Live record from the
      # 3 December 2026 rebalance (positions effective 2026-12).
      - name: v1.1 positions and paper P&L (v1.0 + T18 rule)
        id: update_v11
        continue-on-error: true
        run: python -m em_macro.systematic_v11 update 2>&1 | tee "$RUNNER_TEMP/update_v11.log"

      - name: v1.1 rebalance log (scheduled date vs actual run date)
        id: rebalance_v11
        if: steps.update_v11.outcome == 'success'
        continue-on-error: true
        run: python -m em_macro.systematic_v11 rebalance 2>&1 | tee "$RUNNER_TEMP/rebalance_v11.log"

      # Monthly investor letters (ledger/letters.py): one per book (Me, Algorithm, Janus) for the month just booked,
      # figures from the data, narrative via the Anthropic API when the secret exists. Never blocks the rebalance.
      # (Post-mortems are written in the Janus daily review session, not here.)
      - name: Investor letters and what changed
        id: letters
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install anthropic >/dev/null 2>&1 || true
          python -m ledger.letters 2>&1 | tee "$RUNNER_TEMP/letters.log"
          python -m ledger.changes 2>&1 | tee -a "$RUNNER_TEMP/letters.log"

      - name: Tests
        id: tests
        run: python -m pytest -q tests 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Commit and push
        id: commit
        run: |
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/systematic/positions.csv results/systematic/paper_pnl.csv \
                    results/systematic/rebalance_log.csv \
                    results/systematic/position_adjustments.csv results/systematic/overrides_log.csv \
                    data/processed data/raw/bondspot data/raw/bist data/raw/imf_weo \
                    results/coverage_report.md results/panel_coverage.md \
                    results/screener data/ledger/reports
            for f in data/ledger/changes.json data/ledger/state.json; do
              [ -e "$f" ] && git add -- "$f"     # one path at a time: a missing path must not unstage the others
            done
            # v1.1 (its own folder) and the v1.0/v1.1 turnover comparison; absent only if v1.1 never ran
            git add results/systematic_v1.1 results/live_compare 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "nothing to commit"
            else
              git commit -m "Monthly systematic update $(date -u +%Y-%m-%d)"
              git push
            fi
          } 2>&1 | tee "$RUNNER_TEMP/commit.log"

      - name: Close open alert issues after a successful run
        if: success() && steps.update_v11.outcome == 'success' && steps.rebalance_v11.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label alert \
                       --json number,title --jq '.[] | select(.title | startswith("[ALERT] systematic-monthly")) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed \
              --comment "Resolved: systematic-monthly succeeded on $(date -u +%Y-%m-%d): $RUN_URL"
            echo "closed alert issue #$n"
          done

      - name: Open or update the alert issue
        if: failure() || steps.update_v11.outcome == 'failure' || steps.rebalance_v11.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          OUTCOMES: >-
            install=${{ steps.install.outcome }}
            refresh=${{ steps.refresh.outcome }}
            update=${{ steps.update.outcome }}
            rebalance=${{ steps.rebalance.outcome }}
            overlay=${{ steps.overlay.outcome }}
            update_v11=${{ steps.update_v11.outcome }}
            rebalance_v11=${{ steps.rebalance_v11.outcome }}
            tests=${{ steps.tests.outcome }}
            commit=${{ steps.commit.outcome }}
        run: |
          declare -A names=([install]="Install" [refresh]="Refresh data" [update]="Positions and paper P&L"
                            [rebalance]="Rebalance log" [overlay]="Political-risk overlay and overrides"
                            [update_v11]="v1.1 positions and paper P&L" [rebalance_v11]="v1.1 rebalance log"
                            [tests]="Tests" [commit]="Commit and push")
          step=""
          for kv in $OUTCOMES; do
            if [ "${kv#*=}" = "failure" ]; then step="${kv%%=*}"; break; fi
          done
          title="[ALERT] systematic-monthly failed $(date -u +%Y-%m-%d)"
          body="$RUNNER_TEMP/alert.md"
          {
            echo "The monthly systematic update failed: $RUN_URL (attempt $RUN_ATTEMPT)."
            echo
            if [ -n "$step" ]; then
              echo "**Failing step:** ${names[$step]:-$step}"
              echo
              echo "**End of its log:**"
              echo
              echo '```'
              sed -e 's/\x1b\[[0-9;]*[mK]//g' "$RUNNER_TEMP/$step.log" 2>/dev/null | tail -n 60
              echo '```'
            else
              echo "**Failing step:** a setup step before the pipeline (checkout, Python or the cache); see the run log."
            fi
            echo
            if { [ "$step" = "update_v11" ] || [ "$step" = "rebalance_v11" ]; } && [ "$COMMIT_OUTCOME" = "success" ]; then
              echo "Only the v1.1 step failed: v1.0's rebalance (results/systematic/) was committed as usual;"
              echo "v1.1's positions and P&L for this month were not updated. Fix the cause, then re-run the"
              echo "workflow (Actions > systematic-monthly > Run workflow); both rebalance logs record the actual"
              echo "run date (v1.0's re-run reproduces the same positions)."
            else
              echo "This month's rebalance has not been committed. Fix the cause, then re-run the workflow"
              echo "(Actions > systematic-monthly > Run workflow); the rebalance log will record the actual run date."
            fi
          } > "$body"
          gh label create alert --repo "$GITHUB_REPOSITORY" --color d73a4a \
            --description "Automated failure alert from a workflow" --force >/dev/null 2>&1 || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label alert \
                       --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            echo "commented on existing alert issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label alert --body-file "$body"
          fi

  # GitHub deletes caches that are not accessed for 7 days, so a monthly run would never find the
  # previous month's copy.  Restoring it twice a week keeps the newest raw-downloads cache alive.
  keep-cache:
    if: github.event_name == 'schedule' && github.event.schedule == '37 6 * * 1,4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the path list must be identical to the update job's: actions/cache only matches caches
      # saved with the same path list (run 4 could not see run 3's cache after the list changed)
      - name: Touch the newest raw-downloads cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            !data/raw/bondspot
            !data/raw/bist
            !data/raw/imf_weo
          key: raw-downloads-keepalive-${{ github.run_id }}
          restore-keys: raw-downloads-
