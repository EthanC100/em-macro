# Starts the "Janus quick check" Claude Code scheduled task (docs/janus/quick_check.md) every 30 minutes on weekdays,
# 06:00 to 21:30 UTC, through the task's API trigger. A scheduled task's own schedule cannot run more often than
# hourly, so the half-hourly cadence comes from here. Nothing else happens in this workflow: no Anthropic Messages API
# call and no repository change. The session itself reads the book, checks the news and pushes its record to main.
#
# Secrets (Settings > Secrets and variables > Actions):
#   JANUS_FIRE_URL    the task's Fire URL, https://api.anthropic.com/v1/claude_code/routines/trig_.../fire
#   JANUS_FIRE_TOKEN  the task's API token (shown once when generated on claude.ai/code/routines)
# Headers follow https://code.claude.com/docs/en/web-scheduled-tasks ("Trigger a scheduled task"): Authorization:
# Bearer <token>, anthropic-beta: experimental-cc-routine-2026-04-01, anthropic-version: 2023-06-01. The endpoint
# allows 30 fires per hour per task; this uses 2. GitHub may start scheduled runs late or skip them under load.
name: janus-fire

on:
  schedule:
    - cron: "*/30 6-21 * * 1-5"   # :00 and :30, 06:00-21:30 UTC, Monday-Friday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-fire
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire the Janus quick check
        env:
          FIRE_URL: ${{ secrets.JANUS_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.JANUS_FIRE_TOKEN }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            echo "::error::JANUS_FIRE_URL or JANUS_FIRE_TOKEN is not set (repository secrets)"; exit 1
          fi
          body=$(printf '{"text": "janus-fire run %s at %s UTC (informational only)"}' "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M)")
          code=$(curl -sS -o "$RUNNER_TEMP/fire.json" -w '%{http_code}' --max-time 60 --retry 2 --retry-delay 5 \
            -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$body")
          echo "HTTP $code"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('type'), d.get('claude_code_session_url') or d)" "$RUNNER_TEMP/fire.json" || cat "$RUNNER_TEMP/fire.json"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::fire returned HTTP $code"; exit 1; }
