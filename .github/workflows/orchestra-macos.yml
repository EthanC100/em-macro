# Manhattan orchestra on macOS: the orchestra's tests on a GitHub-hosted Mac, so that its macOS behaviour (ps, mount,
# sysctl, ioreg, flock, process groups, signals, memory accounting) is verified on macOS and not only reasoned about.
# docs/manhattan/orchestra/OPERATIONS.md section 14.
#
# It writes nothing and runs nothing but tests: read-only token (contents: read), no secret, no stored credential, no
# commit, push, issue, comment or artifact; synthetic jobs only (the private store points at a path that does not
# exist, as in tests.yml). It runs on pull requests to main that touch the orchestra, and by no other trigger: no
# schedule, no dispatch. A GitHub-hosted macOS runner is free for a public repository.
name: orchestra-macos

on:
  pull_request:
    branches: [main]
    paths:
      - "manhattan/orchestra/**"
      - "tests/test_manhattan_orchestra.py"
      - "tests/test_manhattan_orchestra_failures.py"
      - ".github/workflows/orchestra-macos.yml"

permissions:
  contents: read

concurrency:
  group: orchestra-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash               # -eo pipefail: the step fails when pytest fails, even through tee (hard rule 15)
    env:
      EM_MACRO_DATA: /nonexistent/em-macro-data
      DATA_REPO_URL: /nonexistent/em-macro-data.git
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Host facts (kinds only, no identifiers)
        run: |
          sw_vers
          uname -m
          python - <<'PY'
          import os, sys, resource
          from pathlib import Path
          from manhattan.orchestra import procs, safety
          print("tools:", {t: procs.tool(t) for t in procs.TOOLS})
          print("machine_id read:", procs.machine_id() is not None)
          b = procs.boot_id() or ""
          print("boot_id source:", b.split(":", 1)[0] if b else None)
          for p in (Path.home(), Path(os.environ.get("RUNNER_TEMP", "/tmp")), Path("/private/tmp")):
              t = procs.fs_type(p.resolve())
              print("fs_type", p, "->", t, "network:", safety.is_network_fs(t))
          print("ru_maxrss raw:", resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)
          PY

      - name: Orchestra tests on macOS
        run: python -m pytest -q -p no:cacheprovider -rs tests/test_manhattan_orchestra.py tests/test_manhattan_orchestra_failures.py 2>&1 | tee "$RUNNER_TEMP/orchestra.log"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Orchestra on macOS (${GITHUB_SHA::7})"
            echo '```'
            grep -E "^(FAILED|ERROR|SKIPPED)|passed|failed|error" "$RUNNER_TEMP/orchestra.log" | tail -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
