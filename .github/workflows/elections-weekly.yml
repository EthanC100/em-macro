# Election tracker (alerts only): weekly calendar refresh and point-in-time poll snapshots.
# Free public sources only: Wikipedia (MediaWiki API / REST) and IFES ElectionGuide.
# Scheduled workflows run only on the repository's default branch.
name: elections-weekly

on:
  schedule:
    - cron: "17 6 * * 1"     # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: elections
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt -r requirements-elections.txt

      - name: Tests (election tracker)
        run: python -m pytest -q tests/test_election_tracker.py tests/test_election_calendar.py

      - name: Calendar refresh and poll snapshots (elections within 90 days)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m em_macro.election_tracker weekly

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elections docs/elections
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Elections weekly: calendar refresh and poll snapshots $(date -u +%Y-%m-%d)"
            git push
          fi
