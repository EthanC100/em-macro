# Daily Ledger automation: mark every registry instrument to market (data/ledger/marks.csv), close
# decisions whose stop was hit or whose horizon passed, resolve mechanical forecasts past their resolution date
# from official data, open "[RESOLVE?] <id>" issues for anything that could not be settled, commit the ledger
# files, apply Janus's fills and the audit seals through scripts/ledger_commit.sh, and rebuild the app.
# No API call to Claude is made: event forecasts are settled by the "Ledger forecast resolver" Claude Code
# session (docs/ledger/forecast_resolver.md); this run opens their [RESOLVE?] issue only if no session has
# settled them within session_resolve_grace_days (ledger/automation.json).
#
# Repository settings needed once: Settings > Actions > General > Workflow permissions = "Read and
# write permissions".
name: ledger-daily

# 2026-11-06: runs on 4 and 5 Nov were green but committed nothing: `git add` listed automation_log.csv and
# api_log.csv, which did not exist yet, so git refused the whole add (exit 128) and `2>/dev/null || true` hid it;
# the step then printed "nothing to commit". The commit step now stages only paths that exist, fails if a
# changed ledger file is left unstaged or the push fails, and a marks watchdog (here and in ledger-watchdog)
# opens "[ALERT] Ledger marks stale" when the newest mark is more than 2 days old.
# 2026-11-11 (Q018, approved by Ethan): GitHub creates this repository's schedule events 5.5-10.5 hours late, so the
# "ledger-daily kick" Claude Code scheduled task dispatches this workflow at 06:07 and 22:07 UTC (docs/agent-system.md).
# The crons stay as backups; the watchdog step alerts ("[ALERT] Kick window missed: ledger-daily late") when a kick window had no run.
on:
  schedule:
    - cron: "52 5 * * *"      # backup (Q018): 05:52 UTC daily, before the 06:41 app build
    - cron: "22 9 * * *"      # backup: GitHub delays or drops scheduled runs (5 Nov ran at 13:31); re-running is idempotent
  workflow_dispatch:          # primary (Q018): the ledger-daily kick task, 06:07 and 22:07 UTC

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: ledger-writers         # with private-commitments and shadows-setup: one of them edits the ledger at a time.
                                # ledger-intake left this group (Q022): it writes through scripts/ledger_commit.sh
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_DATA_TOKEN: ${{ secrets.EM_MACRO_DATA_TOKEN != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        id: install
        run: pip install -r requirements.txt pytest 2>&1 | tee "$RUNNER_TEMP/install.log"

      - name: Mark every instrument to market
        id: marks
        run: python -m ledger.marks 2>&1 | tee "$RUNNER_TEMP/marks.log"

      - name: Close decisions and resolve forecasts
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ledger.resolve --out "$RUNNER_TEMP/resolve.json" 2>&1 | tee "$RUNNER_TEMP/resolve.log"

      # Futures and options (my decisions: ledger/derivs.py; Janus: ledger/janus.py) are marked at CME-group final
      # settlements by contract month from Databento GLBX.MDP3 (ledger/settlements.py). Settlements are licensed
      # (CME terms, passed on by Databento), so they go only to the private em-macro-data repository; this repository
      # gets P&L in % only (data/ledger/derivative_pnl.csv, data/janus/futures_pnl.csv) and any closes. Every Databento
      # request is quoted first and refused if it would take the day's spend above US$1 (shared by both books).
      # Secrets: EM_MACRO_DATA_TOKEN (contents read/write on EthanC100/em-macro-data) and DATABENTO_API_KEY. Without
      # them nothing is fetched or marked. (The CME website fetch was dropped on 2026-11-06: cmegroup.com held every
      # scripted request until the 60-second timeout, five times a run.)
      - name: Private data store for licensed settlements
        if: env.HAS_DATA_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: EthanC100/em-macro-data
          token: ${{ secrets.EM_MACRO_DATA_TOKEN }}
          path: .em-macro-data
          sparse-checkout: |
            ledger
            databento/shadows
            shadows
      - name: Futures settlements (Databento) and futures/options P&L
        id: derivs
        env:
          EM_MACRO_DATA: ${{ github.workspace }}/.em-macro-data
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          if [ -d .em-macro-data ] && [ -n "$DATABENTO_API_KEY" ]; then
            pip install -q databento
            python -m ledger.settlements fetch 2>&1 | tee "$RUNNER_TEMP/derivs.log"
          else
            echo "no private store or no DATABENTO_API_KEY: settlements not fetched" | tee "$RUNNER_TEMP/derivs.log"
          fi
          python -m ledger.derivs mark --no-fetch 2>&1 | tee -a "$RUNNER_TEMP/derivs.log"
          if [ -d .em-macro-data/ledger ]; then
            cd .em-macro-data
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ledger
            git diff --cached --quiet || { git commit -q -m "Ledger futures settlements $(date -u +%Y-%m-%d)"; git push -q; }
          fi

      # T25-T26 zero-size live shadows (docs/prereg/T25-T26_live_shadows.md, §4 and §7): new Databento final
      # settlements for the shadows' contracts (one quote, under the same US$1 daily cap), then the live path is
      # rebuilt from the first live month. Settlements, per-market P&L and trades stay in em-macro-data; this
      # repository gets results/shadows (weights, contract codes, % returns, status). Nothing runs before the
      # go-live record (results/shadows/GO_LIVE.json, written by the shadows-setup workflow). A failure here never
      # stops the marks; it is an outage under §7.3 and the next run recomputes.
      - name: Shadows T25-T26 (zero size, paper)
        id: shadows
        continue-on-error: true
        env:
          EM_MACRO_DATA: ${{ github.workspace }}/.em-macro-data
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          if [ ! -f results/shadows/GO_LIVE.json ]; then echo "shadows: no go-live record yet"; exit 0; fi
          if [ ! -d .em-macro-data/databento/shadows ]; then echo "::warning::shadows: no private store"; exit 0; fi
          if [ -n "$DATABENTO_API_KEY" ]; then
            python -m em_macro.t2526_data update 2>&1 | tee "$RUNNER_TEMP/shadows.log"
          fi
          python -m em_macro.t2526 daily 2>&1 | tee -a "$RUNNER_TEMP/shadows.log"
          cd .em-macro-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- databento/shadows shadows ledger
          git diff --cached --quiet || { git commit -q -m "Shadows T25-T26 $(date -u +%Y-%m-%d)"; git pull -q --rebase; git push -q; }

      # Post-mortems are written in the Janus daily review session (docs/janus/daily_review.md), not here.
      - name: Stress tests and what changed
        id: analytics
        continue-on-error: true
        run: |
          python -m ledger.stress 2>&1 | tee "$RUNNER_TEMP/analytics.log"
          python -m ledger.changes 2>&1 | tee -a "$RUNNER_TEMP/analytics.log"

      - name: Ledger tests still pass
        id: tests
        run: python -m pytest -q tests/test_ledger.py tests/test_automation.py tests/test_janus.py tests/test_books.py 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(data/ledger/marks.csv data/ledger/decisions.csv data/ledger/forecasts.csv data/ledger/derivative_pnl.csv
                 data/ledger/automation_log.csv data/ledger/api_log.csv data/ledger/postmortems
                 data/ledger/reports data/ledger/changes.json data/ledger/state.json
                 data/ledger/stress.json data/ledger/stress_history.json data/raw/bist data/raw/bondspot
                 results/shadows)
          existing=()
          for p in "${paths[@]}"; do [ -e "$p" ] && existing+=("$p"); done
          git add -- "${existing[@]}"
          # nothing the jobs changed may be left behind (this is what failed silently on 4 and 5 Nov)
          if ! git diff --quiet -- "${existing[@]}"; then
            echo "::error::ledger files changed but were not staged"; git status --short; exit 1
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Ledger daily $(date -u +%Y-%m-%d): marks, closes and resolutions"
            pushed=false
            for i in 1 2 3 4; do
              if git push origin HEAD:main; then pushed=true; break; fi
              sleep $((i * 3)); git pull --rebase origin main
            done
            [ "$pushed" = true ] || { echo "::error::push failed after 4 attempts"; exit 1; }
          fi
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          python -c "import json;print(json.load(open('$RUNNER_TEMP/resolve.json')).get('summary',''))" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Janus fills at the next official daily mark, stops, horizons, and the audit seals of today's closes and
      # resolutions: applied on a fresh main after the commit above, through the same script the sessions use, so
      # concurrent appends never break a hash chain.
      - name: Janus fills, stops and horizon closes; audit seals
        id: janus
        env:
          EM_MACRO_DATA: ${{ github.workspace }}/.em-macro-data     # Janus's futures marks (read only here)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          git worktree add -q --detach "$RUNNER_TEMP/janus-wt" origin/main     # a clean tree: the job's caches stay here
          cd "$RUNNER_TEMP/janus-wt"
          bash scripts/ledger_commit.sh "Ledger daily $(date -u +%Y-%m-%d): Janus fills, stops and closes; seals" -- true 2>&1 | tee "$RUNNER_TEMP/janus.log"

      - name: Open or update [RESOLVE?] issues
        id: issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ledger --repo "$GITHUB_REPOSITORY" --color 1d4ed8 --force >/dev/null 2>&1 || true
          gh label create "ledger:resolve?" --repo "$GITHUB_REPOSITORY" --color e99695 \
            --description "The daily resolver could not settle this entry" --force >/dev/null 2>&1 || true
          n=$(python -c "import json;print(len(json.load(open('$RUNNER_TEMP/resolve.json')).get('issues',[])))")
          for i in $(seq 0 $((n - 1))); do
            python -c "import json;print(json.load(open('$RUNNER_TEMP/resolve.json'))['issues'][$i]['title'])" > "$RUNNER_TEMP/title.txt"
            python -c "import json;print(json.load(open('$RUNNER_TEMP/resolve.json'))['issues'][$i]['body'])" > "$RUNNER_TEMP/body.md"
            title=$(cat "$RUNNER_TEMP/title.txt")
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "ledger:resolve?" --limit 100 \
                         --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
            if [ -n "$existing" ]; then
              last=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body,comments \
                       --jq '(.comments | last | .body) // .body')
              if [ "$last" != "$(cat "$RUNNER_TEMP/body.md")" ]; then
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
                echo "updated #$existing: $title"
              else
                echo "unchanged #$existing: $title"
              fi
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label ledger --label "ledger:resolve?" \
                --body-file "$RUNNER_TEMP/body.md"
              echo "opened: $title"
            fi
          done
          # close [RESOLVE?] issues whose entry is now resolved (by the resolver or by a Resolve form)
          python - <<'EOF' > "$RUNNER_TEMP/resolved_ids.txt"
          import csv
          ids = []
          for p in ("data/ledger/decisions.csv", "data/ledger/forecasts.csv"):
              with open(p, newline="", encoding="utf-8") as f:
                  ids += [r["id"] for r in csv.DictReader(f) if (r.get("status") or "").lower() == "resolved"]
          print("\n".join(ids))
          EOF
          for id in $(cat "$RUNNER_TEMP/resolved_ids.txt"); do
            for num in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "ledger:resolve?" --limit 100 \
                           --json number,title --jq ".[] | select(.title == \"[RESOLVE?] $id\") | .number"); do
              gh issue close "$num" --repo "$GITHUB_REPOSITORY" --reason completed --comment "$id is now resolved in the ledger."
              echo "closed #$num ($id resolved)"
            done
          done

      - name: Rebuild the app
        if: steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ledger-pages.yml --repo "$GITHUB_REPOSITORY" --ref main || true

      - name: Marks watchdog (alert when the newest mark is more than 2 days old)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main && git checkout -q FETCH_HEAD -- data/ledger/marks.csv || true
          python -m ledger.watchdog --out "$RUNNER_TEMP/watchdog.json"
          bash .github/scripts/marks_alert.sh "$RUNNER_TEMP/watchdog.json"
          # Q018: a kick window (06:07, 22:07 UTC) with no ledger-daily run opens "[ALERT] Kick window missed: ledger-daily late"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ledger-daily.yml/runs?per_page=30" > "$RUNNER_TEMP/runs.json" \
            && python -m ledger.watchdog --late-runs "$RUNNER_TEMP/runs.json" --out "$RUNNER_TEMP/late.json" \
            && bash .github/scripts/marks_alert.sh "$RUNNER_TEMP/late.json" || echo "lateness check could not run"
          # Q022: re-run ledger-intake for any open Ledger form with no intake comment 30 minutes after it was opened or
          # last edited (its run was lost); intake has its own per-issue group, so nothing here can drop it
          owner="${GITHUB_REPOSITORY%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          gh api graphql -f owner="$owner" -f repo="$repo" -f query="$(python -c 'from ledger.intake_runs import SWEEP_QUERY;print(SWEEP_QUERY)')" \
            > "$RUNNER_TEMP/issues.json" \
            && for n in $(python -m ledger.intake_runs sweep --issues "$RUNNER_TEMP/issues.json"); do
                 echo "re-running ledger-intake for issue #$n"; gh workflow run ledger-intake.yml --ref main -f issue="$n"
               done || echo "intake sweep could not run"

      - name: Job summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "### Ledger daily $(date -u +%Y-%m-%d)"
            echo
            python -m ledger.watchdog --lateness "$EVENT" "$started" --schedule "$SCHEDULE" 2>/dev/null || true
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/marks.log" 2>/dev/null
            echo '```'
            echo
            cat "$RUNNER_TEMP/resolve.log" 2>/dev/null | tail -n 60
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOMES: >-
            install=${{ steps.install.outcome }}
            marks=${{ steps.marks.outcome }}
            resolve=${{ steps.resolve.outcome }}
            tests=${{ steps.tests.outcome }}
            commit=${{ steps.commit.outcome }}
            janus=${{ steps.janus.outcome }}
            issues=${{ steps.issues.outcome }}
        run: |
          step=""
          for kv in $OUTCOMES; do
            if [ "${kv#*=}" = "failure" ]; then step="${kv%%=*}"; break; fi
          done
          title="[ALERT] ledger-daily failed $(date -u +%Y-%m-%d)"
          body="$RUNNER_TEMP/alert.md"
          {
            echo "The daily Ledger automation failed: $RUN_URL."
            echo
            echo "**Failing step:** ${step:-setup}"
            echo
            echo '```'
            sed -e 's/\x1b\[[0-9;]*[mK]//g' "$RUNNER_TEMP/$step.log" 2>/dev/null | tail -n 60
            echo '```'
            echo
            echo "Marks, closes and resolutions were not committed today. Fix the cause and re-run (Actions > ledger-daily > Run workflow)."
          } > "$body"
          gh label create alert --repo "$GITHUB_REPOSITORY" --color d73a4a --force >/dev/null 2>&1 || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label alert \
                       --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label alert --body-file "$body"
          fi

      - name: Close alert issues after a successful run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label alert \
                       --json number,title --jq '.[] | select(.title | startswith("[ALERT] ledger-daily")) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Resolved: ledger-daily succeeded on $(date -u +%Y-%m-%d)."
          done
