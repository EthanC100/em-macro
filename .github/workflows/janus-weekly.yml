# Janus, the AI discretionary paper book (ledger/janus.py; Ledger app > Janus).
# Weekly on Mondays at 06:00 UTC, and by hand (Actions > janus-weekly > Run workflow). Each run:
#   1. refreshes the daily marks (python -m ledger.marks),
#   2. fills, stops and closes positions up to date (python -m ledger.janus mark),
#   3. calls the Anthropic API (model in ledger/automation.json: janus_model, the current Claude Opus) with web
#      search: reviews every open position (hold, close, tighten a stop; never widen) and may open new ones,
#      or logs a "no trade" record with its reasoning,
#   4. a second call per new position writes The Opposition (the strongest case against it),
#   5. commits data/janus/ (append-only, hash-chained records) and rebuilds the app.
# It needs the ANTHROPIC_API_KEY repository secret. If the key is missing or rejected the run stops before writing
# anything and opens an alert issue.
#
# The push trigger on build/ledger-v2 exists only so the first run could be started from the branch before the
# workflow reached main (workflow_dispatch needs the file on the default branch); it fires only when
# data/janus/run_request.txt changes on that branch.
name: janus-weekly

on:
  schedule:
    - cron: "0 6 * * 1"       # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches: [build/ledger-v2]
    paths: [data/janus/run_request.txt]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: ledger-intake          # the ledger files are edited by one job at a time
  cancel-in-progress: false

jobs:
  janus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        id: install
        run: pip install -r requirements.txt anthropic pytest 2>&1 | tee "$RUNNER_TEMP/install.log"

      - name: Refresh daily marks
        id: marks
        run: python -m ledger.marks 2>&1 | tee "$RUNNER_TEMP/marks.log"

      - name: Fills, stops and closes up to date
        id: mark
        run: python -m ledger.janus mark 2>&1 | tee "$RUNNER_TEMP/mark.log"

      - name: Janus weekly review (Anthropic API with web search) and The Opposition
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python -m ledger.janus run 2>&1 | tee "$RUNNER_TEMP/run.log"
          code=${PIPESTATUS[0]}
          if [ "$code" = "2" ]; then echo "::error::ANTHROPIC_API_KEY missing or rejected"; fi
          exit $code

      - name: Chain verifies and tests pass
        id: tests
        run: |
          python -m ledger.janus verify
          python -m ledger.audit seal 2>/dev/null || true
          python -m ledger.changes 2>/dev/null || true
          python -m pytest -q tests/test_janus.py tests/test_ledger.py 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(data/janus data/ledger/marks.csv data/ledger/seals.jsonl data/ledger/changes.json data/ledger/state.json)
          existing=(); for p in "${paths[@]}"; do [ -e "$p" ] && existing+=("$p"); done
          git add -- "${existing[@]}"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Janus weekly $(date -u +%Y-%m-%d): review, new positions and The Opposition"
          for i in 1 2 3 4; do
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            sleep $((i * 3)); git pull --rebase origin "${{ github.ref_name }}"
          done
          echo "::error::push failed"; exit 1

      - name: Rebuild the app
        if: success() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ledger-pages.yml --repo "$GITHUB_REPOSITORY" --ref main || true

      - name: Job summary
        if: always()
        run: |
          { echo "### Janus $(date -u +%Y-%m-%d)"; echo; echo '```'; tail -n 80 "$RUNNER_TEMP/run.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[ALERT] janus-weekly failed $(date -u +%Y-%m-%d)"
          { echo "Janus's weekly run failed: $RUN_URL"; echo; echo '```';
            sed -e 's/\x1b\[[0-9;]*[mK]//g' "$RUNNER_TEMP/run.log" 2>/dev/null | tail -n 40; echo '```';
            echo; echo "If the log says the key is missing or rejected, check the ANTHROPIC_API_KEY repository secret."; } > "$RUNNER_TEMP/alert.md"
          gh label create alert --repo "$GITHUB_REPOSITORY" --color d73a4a --force >/dev/null 2>&1 || true
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label alert --body-file "$RUNNER_TEMP/alert.md"
