name: Decision record
description: Log a trade or no-trade decision in the Ledger. A workflow checks it, writes it to data/ledger/decisions.csv and closes this issue with its id.
title: "[Decision] "
labels: ["ledger", "ledger:decision"]
body:
  - type: markdown
    attributes:
      value: |
        The Risk Manager checks every record before it is logged and posts its check as a comment. Rejected: a stop without a numeric price or yield level; a continuous position risking more than 2% of the account; an event bet not sized at half of quarter-Kelly on its probability. Flagged: overlap with the algorithm's positions in the same country or currency; catalysts from the Ledger calendar inside the holding period. Dates must parse (YYYY-MM-DD is safest). Put the entry level in the entry trigger ("at 5.40"): it drives the live P&L and the automatic close.
  - type: input
    id: date
    attributes:
      label: Date
      description: Decision date, YYYY-MM-DD
      placeholder: "2026-11-03"
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
      placeholder: "Brazil"
    validations:
      required: true
  - type: input
    id: instrument
    attributes:
      label: Instrument
      placeholder: "USD/BRL, FR-DE 10y OAT-Bund spread, MX10Y ..."
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - Buy
        - Sell
        - No trade
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Size (% of account at risk)
      description: The % of the account lost if the stop is hit. 0 for no trade; at most 2 for a position.
      placeholder: "1.0"
    validations:
      required: true
  - type: dropdown
    id: position_type
    attributes:
      label: Position type
      description: A continuous position may risk at most 2%. An event bet must be sized at half of quarter-Kelly on the probability below (0.125 × (2p − 1) of the account at even odds). Choose either for a no-trade.
      options:
        - Continuous position
        - Event bet
    validations:
      required: true
  - type: input
    id: probability
    attributes:
      label: Probability my view is right
      description: Percent, 0-100
      placeholder: "65"
    validations:
      required: true
  - type: input
    id: horizon
    attributes:
      label: Horizon (date)
      placeholder: "2027-04-18"
    validations:
      required: true
  - type: textarea
    id: entry_trigger
    attributes:
      label: Entry trigger
      description: What gets you in. Include the entry level if known (it is used for P&L at resolution).
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Stop / exit if wrong
      description: Must contain a numeric price or yield level, e.g. "exit if USD/BRL closes above 5.70" or "spread tightens to 115bp".
    validations:
      required: true
  - type: textarea
    id: thesis
    attributes:
      label: Thesis
    validations:
      required: true
  - type: textarea
    id: key_factors
    attributes:
      label: Key factors
    validations:
      required: true
  - type: textarea
    id: change_mind
    attributes:
      label: What would change my mind
    validations:
      required: true
  - type: textarea
    id: vs_consensus
    attributes:
      label: How this differs from market consensus
    validations:
      required: true
